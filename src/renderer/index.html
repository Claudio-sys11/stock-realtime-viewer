<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" />
  <title>주식 뷰어 — 관심종목</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="index-bar" id="indexBar"></div>

  <div class="topbar">
    <strong>관심종목</strong>
    <div class="row">
      <span class="muted" style="font-size:11px">네이버 시세</span>
      <button class="ghost" id="themeToggle" title="화이트/블랙 전환">🌙 블랙</button>
    </div>
  </div>

  <div class="search-box">
    <input id="symbolInput" placeholder="종목명 또는 코드 검색 (예: 삼성전자, 005930)" autocomplete="off" />
    <ul id="searchResults" class="search-results"></ul>
  </div>

  <ul class="watchlist" id="watchlist"></ul>

  <div class="status">
    <span id="wsDot" class="dot"></span>
    <span id="wsText">대기 중</span>
    <span style="float:right" id="appVersion"></span>
  </div>

  <script src="index.js"></script>
</body>
</html>
